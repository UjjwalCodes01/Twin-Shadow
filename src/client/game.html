<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="game.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="full-screen" content="yes" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="360-fullscreen" content="true" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Twin Shadows</title>
  </head>
  <body data-state="loading">
    <header class="readout">
      <section class="panel front" id="panel-front" aria-label="Front shadow">
        <h2 class="panel-label">Front</h2>
        <div class="panel-grid" id="panel-front-grid"></div>
      </section>
      <div class="status">
        <p class="block-count" id="block-count">0 blocks</p>
        <p class="stars" id="stars" hidden></p>
        <p class="floating-warning" id="floating-warning" hidden></p>
        <button class="submit" id="submit" type="button" disabled>Submit</button>
        <p class="submit-note" id="submit-note" hidden></p>
        <button class="result-open" id="result-open" type="button" hidden>Results</button>
      </div>
      <section class="panel side" id="panel-side" aria-label="Side shadow">
        <h2 class="panel-label">Side</h2>
        <div class="panel-grid" id="panel-side-grid"></div>
      </section>
    </header>

    <aside class="viewing" id="viewing" aria-live="polite" hidden>
      <p class="viewing-owner" id="viewing-owner"></p>
      <p class="viewing-detail" id="viewing-detail"></p>
      <div class="viewing-actions">
        <button id="viewing-prev" type="button" aria-label="Previous sculpture">&lsaquo; Prev</button>
        <button id="viewing-back" type="button">Back to mine</button>
        <button id="viewing-next" type="button" aria-label="Next sculpture">Next &rsaquo;</button>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="notice" id="notice" role="status">
        <p id="notice-text">Loading puzzle&hellip;</p>
        <button id="retry" type="button" hidden>Retry</button>
      </div>
    </main>

    <footer class="controls">
      <div class="mode" role="group" aria-label="Tap mode">
        <button id="mode-add" type="button" aria-pressed="true">Add</button>
        <button id="mode-remove" type="button" aria-pressed="false">Remove</button>
      </div>
      <button id="rotate-left" type="button" aria-label="Rotate left">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12a7 7 0 1 0 2.6-5.4" />
          <path d="M8 2.5v4.6H3.4" />
        </svg>
      </button>
      <button id="rotate-right" type="button" aria-label="Rotate right">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12a7 7 0 1 1-2.6-5.4" />
          <path d="M16 2.5v4.6h4.6" />
        </svg>
      </button>
      <button id="undo" type="button" disabled>Undo</button>
      <button id="reset" type="button" disabled>Reset</button>
      <nav class="debug-bar" id="debug-bar" aria-label="Debug states" hidden></nav>
    </footer>

    <div class="result-layer" id="result-layer" hidden>
      <section class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <h2 class="result-title" id="result-title">Solved</h2>
        <p class="result-status" id="result-status" role="status">Loading results&hellip;</p>
        <button class="result-retry" id="result-retry" type="button" hidden>Retry</button>
        <div class="result-body" id="result-body" hidden>
          <p class="result-stars" id="result-stars"></p>
          <p class="result-blocks" id="result-blocks"></p>
          <p class="result-under" id="result-under" hidden>Under par</p>
          <p class="result-rank" id="result-rank"></p>
          <p class="result-line" id="result-rarity"></p>
          <p class="result-line" id="result-streak"></p>
          <p class="result-line" id="result-record"></p>
          <ol class="result-list" id="result-list" aria-label="Fewest blocks"></ol>
          <div class="result-join" id="result-join" hidden>
            <p class="result-join-text" id="result-join-text" role="status"></p>
            <button class="join-button" id="result-join-yes" type="button">Join</button>
            <button class="join-button secondary" id="result-join-no" type="button">No thanks</button>
          </div>
        </div>
        <div class="card-actions">
          <button class="card-button" id="result-gallery" type="button">See other sculptures</button>
          <div class="card-row">
            <button class="card-button secondary" id="result-share" type="button" hidden>Share result</button>
            <button class="card-button secondary" id="result-close" type="button">Back to the board</button>
          </div>
        </div>
      </section>
    </div>

    <div class="result-layer" id="gallery-layer" hidden>
      <section class="result-card" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
        <h2 class="result-title" id="gallery-title">Other sculptures</h2>
        <div class="gallery-sort" role="group" aria-label="Order">
          <button id="gallery-rarest" type="button" aria-pressed="true">Rarest</button>
          <button id="gallery-leanest" type="button" aria-pressed="false">Leanest</button>
        </div>
        <p class="result-status" id="gallery-status" role="status" hidden></p>
        <button class="result-retry" id="gallery-retry" type="button" hidden>Retry</button>
        <ul class="result-list gallery-list" id="gallery-list" aria-label="Sculptures"></ul>
        <button class="card-button secondary" id="gallery-close" type="button">Back to results</button>
      </section>
    </div>

    <script type="module" src="game.ts" defer></script>
  </body>
</html>
